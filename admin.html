<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SJICHOSSO – Msimamizi</title>
<style>
:root{--bg:#07162B;--card:#0D2140;--line:#1C3558;--ink:#EAF0F8;--mut:#A9B6C8;--gold:#F2B705}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px}
.w{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
input,button{font:inherit;min-height:48px;border-radius:12px;border:1px solid var(--line);padding:0 16px;background:var(--card);color:var(--ink);width:100%}
.b{background:var(--gold);color:#0B2545;border:0;font-weight:600;cursor:pointer}
.g{background:transparent;cursor:pointer;width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.err{color:#FFB4A9}
.hide{display:none}
.t{display:flex;gap:8px;margin:16px 0}
.t button{flex:1;cursor:pointer}
.t .on{background:#fff;color:#0B2545;font-weight:600}
</style>
</head>
<body>
<div class="w">
<h1>SJICHOSSO · Msimamizi</h1>
<form id="lg" style="display:grid;gap:12px">
<input id="em" type="email" placeholder="Barua pepe" autocomplete="username" required>
<input id="pw" type="password" placeholder="Nywila" autocomplete="current-password" required>
<button class="b" type="submit">Ingia</button>
<div id="er" class="err"></div>
</form>
<div id="ap" class="hide">
<div class="row"><span id="who" class="mut"></span><button id="out" class="g">Toka</button></div>
<div class="t"><button id="t1" class="on">Maombi ya vyuo</button><button id="t2">Wanaojiunga na habari</button></div>
<div class="row"><span id="cnt" class="mut"></span><button id="csv" class="g">Pakua CSV</button></div>
<div id="ls"></div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA6JJ8SIdb3-ZXhv_hyY0oyuYCECLQRHVg",authDomain:"sjichosso.firebaseapp.com",projectId:"sjichosso",storageBucket:"sjichosso.firebasestorage.app",messagingSenderId:"849406364609",appId:"1:849406364609:web:16fb63a57207fbe0e8fd40"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let col="registrations",rows=[];
const $=id=>document.getElementById(id);
$("lg").onsubmit=async e=>{e.preventDefault();$("er").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)}catch(x){$("er").textContent="Barua pepe au nywila si sahihi."}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("lg").classList.toggle("hide",!!u);$("ap").classList.toggle("hide",!u);if(u){$("who").textContent=u.email;load()}});
async function load(){
$("ls").textContent="Inapakia...";
try{const s=await getDocs(query(collection(db,col),orderBy("at","desc")));rows=s.docs.map(d=>({id:d.id,...d.data()}));draw()}
catch(x){$("ls").textContent="Huna ruhusa ya kuona data hii. Angalia sheria za Firestore."}
}
function draw(){
const l=$("ls");l.textContent="";$("cnt").textContent="Jumla: "+rows.length;
rows.forEach(r=>{
const c=document.createElement("div");c.className="card row";
const a=document.createElement("div");
const t=document.createElement("b");t.textContent=col==="registrations"?r.name:r.email;a.append(t);
const m=document.createElement("div");m.className="mut";
m.textContent=(col==="registrations"?r.college+" · "+r.group+" · ":"")+(r.at?r.at.toDate().toLocaleString():"");a.append(m);
const d=document.createElement("button");d.className="g";d.textContent="Futa";
d.onclick=async()=>{if(confirm("Futa rekodi hii?")){await deleteDoc(doc(db,col,r.id));load()}};
c.append(a,d);l.append(c);
});
}
function tab(c,on,off){col=c;$(on).className="on";$(off).className="";load()}
$("t1").onclick=()=>tab("registrations","t1","t2");
$("t2").onclick=()=>tab("subscribers","t2","t1");
$("csv").onclick=()=>{
const k=col==="registrations"?["name","college","group"]:["email"];
const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const lines=[k.concat("at").join(",")].concat(rows.map(r=>k.map(x=>q(r[x])).concat(q(r.at?r.at.toDate().toISOString():"")).join(",")));
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download=col+".csv";a.click();
};
</script>
</body>
</html>
