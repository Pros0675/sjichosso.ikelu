
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Omba kujiunga na SJICHOSSO.">
  <title>Jiunge na Sisi | SJICHOSSO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="container">
      <h1>SJICHOSSO</h1>
      <p>Umoja, Ushirikiano na Maendeleo</p>

      <nav>
        <a href="index.html">Nyumbani</a>
        <a href="kuhusu.html">Kuhusu Sisi</a>
        <a href="wanachama.html">Wanachama</a>
        <a href="uongozi.html">Uongozi</a>
        <a href="shughuli.html">Shughuli</a>
        <a href="nyaraka.html">Nyaraka</a>
        <a href="jiunge.html">Jiunge</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>Jiunge na SJICHOSSO</h2>
      <p>
        Tunakukaribisha kuwasilisha maombi ya kujiunga
        na SJICHOSSO. Tafadhali jaza taarifa zako kwa usahihi.
      </p>
    </section>

    <section class="section">
      <form id="joinForm">
        <label for="fullName">Majina kamili</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Andika majina yako"
          required
        >

        <label for="phone">Namba ya simu</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Mfano: 07XXXXXXXX"
          required
        >

        <label for="email">Barua pepe</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Mfano: jina@example.com"
        >

        <label for="location">Mahali unapoishi</label>
        <input
          type="text"
          id="location"
          name="location"
          placeholder="Mkoa au wilaya"
          required
        >

        <label for="occupation">Shughuli au kazi yako</label>
        <input
          type="text"
          id="occupation"
          name="occupation"
          placeholder="Andika shughuli yako"
        >

        <label for="reason">Kwa nini ungependa kujiunga?</label>
        <textarea
          id="reason"
          name="reason"
          rows="4"
          placeholder="Eleza kwa ufupi"
        ></textarea>

        <label class="consent">
          <input type="checkbox" id="consent" required>
          Nimehakikisha taarifa nilizojaza ni sahihi.
        </label>

        <button type="submit">Wasilisha Maombi</button>
      </form>

      <p id="formMessage" role="status"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SJICHOSSO. Haki zote zimehifadhiwa.</p>
  </footer>

  <!-- Hifadhi app.js yako iliyopo; usiibadilishe bila kukagua Firebase handler. -->
  <script src="app.js"></script>
</body>
</html>
